<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밤타지트 공략집</title>
<style>
:root{--bg:#eef0f6;--ink:#1e2340;--mute:#6b7193;--acc:#e4456e;--acc2:#2a9d8f;--card:#fff;--line:#d5d9e6}
@media(prefers-color-scheme:dark){:root{--bg:#161a2e;--ink:#eceefb;--mute:#9aa0c3;--card:#222744;--line:#363c63}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard","Noto Sans KR","Noto Sans TC",system-ui,sans-serif;padding-bottom:150px}
header{padding:18px 16px 8px;display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
footer{max-width:760px;margin:24px auto 0;padding:0 16px;text-align:center;color:var(--mute);font-size:11px;line-height:1.6}
footer a{color:inherit;font-weight:700}
h1{font-size:clamp(16px,5vw,20px);margin:0;font-weight:800}
nav{display:flex;gap:clamp(2px,1vw,6px);padding:8px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1 1 auto;padding:10px 4px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mute);font:inherit;font-weight:700;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:0 16px}
.tab{display:none}.tab.on{display:block}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.th{width:58px;height:58px;border-radius:10px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:22px;color:rgba(30,35,64,.5)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}.info b{display:block;overflow:hidden;text-overflow:ellipsis}.info small{color:var(--mute)}
.qty{display:flex;align-items:center;gap:8px}
.qty button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;min-width:34px;height:34px;cursor:pointer;font:inherit;font-weight:700;padding:0 14px}
.qty button{padding:0}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
#sum{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ink);padding:12px 16px;z-index:9}
#sum>div{max-width:760px;margin:0 auto}
#sum .tot{font-size:22px;font-weight:800}
.tip{color:var(--mute);font-size:13px;margin:4px 0}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.rc{background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:10px}
.cd{background:var(--card);border-radius:12px;padding:6px;text-align:center;position:relative;cursor:pointer;user-select:none}
.cd .th{width:100%;height:auto;aspect-ratio:3/4;border-radius:8px}
.cd .th.sq{aspect-ratio:1}
.grid{align-items:start}
.cd.miss .th{filter:grayscale(1);opacity:.45}
.cd .n{font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd .bd{position:absolute;top:10px;right:10px;background:var(--acc);color:#fff;border-radius:99px;font-size:12px;font-weight:800;padding:0 8px;z-index:2}
.cd .mn{position:absolute;top:10px;left:10px;z-index:2;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;width:24px;height:24px;cursor:pointer}
.cd.off{opacity:.3}
.cd{-webkit-touch-callout:none;-webkit-user-select:none}
.cd img{-webkit-user-drag:none;pointer-events:none}
#tip{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);z-index:60;max-width:min(86vw,320px);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;display:flex;flex-direction:column;gap:2px;text-align:center;font-size:13px;opacity:0;pointer-events:none;transition:.15s}
#tip.on{opacity:1;transform:translate(-50%,0)}
#tip span{opacity:.85;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips .btn.on{background:var(--ink);color:var(--bg)}
input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 8px}
canvas{width:100%;border-radius:12px;margin-top:10px;background:#fff}
h2{font-size:16px;margin:16px 0 4px}.no{width:22px;text-align:right;color:var(--mute);flex:none;font-size:13px}
.qty{flex-wrap:wrap;justify-content:center}
.ri{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:3px}.ri.fl{background:color-mix(in srgb,var(--acc2) 14%,transparent);border-radius:8px;padding:6px 8px;margin-top:8px}.ri.bn{color:var(--mute);border-top:1px dashed var(--line);padding-top:4px;margin-top:6px}
.qty .ar{min-width:30px;height:30px;font-size:12px;color:var(--mute)}
.qty .bk{background:var(--acc2);color:#fff;border-color:var(--acc2);padding:0 10px;min-width:40px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}
.ic{background:var(--card);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ic .th{width:100%;height:auto;aspect-ratio:1;border-radius:10px;font-size:28px}
.ic .n{font-size:13px;line-height:1.3;min-height:34px;overflow:hidden;font-weight:700}
.ic small{color:var(--mute)}.ic.sel{outline:2px solid var(--acc2)}
nav button{font-size:clamp(9px,3.7vw,14px);white-space:nowrap;min-width:0;padding:10px clamp(2px,1vw,4px)}
.acc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:8px;font:inherit;font-weight:700;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.wd{text-align:center;font-size:12px;color:var(--mute)}
.day{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.day .ro{position:absolute;top:4px;left:5px;width:6px;height:6px;border-radius:2px;background:var(--ink)}
.rnote{background:color-mix(in srgb,var(--ink) 10%,transparent);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;margin:6px 0}
.day.off{opacity:.3;cursor:default}.day.sel{outline:2px solid var(--ink)}
.day .pc{position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--acc)}
.day .rb{position:absolute;top:3px;right:4px;font-size:11px;background:var(--acc2);color:#fff;border-radius:99px;padding:0 5px}
.slot{background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.slot.mine{outline:2px solid var(--acc)}.slot input{flex-basis:100%;margin:0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--acc2) 18%,transparent)}
.tag.pc{background:color-mix(in srgb,var(--acc) 20%,transparent)}
h3{font-size:14px;margin:14px 0 0;color:var(--mute)}
.row{flex-wrap:wrap}.row .info{flex:1 1 130px}
.qty{flex-wrap:nowrap;justify-content:flex-end;gap:12px;margin-left:auto}
.pg{display:flex;gap:4px;width:132px;justify-content:center}
.qg{display:flex;align-items:center;justify-content:flex-end;gap:8px;width:170px}
.qg b{min-width:22px;text-align:center}.bkph{width:40px;flex:none}
.ic .ar{min-width:26px;width:26px;height:26px;padding:0}.ic .pg{gap:3px}
.ic .qty{flex-wrap:wrap;justify-content:center;gap:6px;margin:0}.ic .pg,.ic .qg{width:auto;justify-content:center}.ic .bkph{display:none}
.dd{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;height:34px;padding:0 12px;font:inherit;font-weight:700;cursor:pointer}
.hm{position:relative}
.hb{border:0;background:none;color:var(--ink);font-size:14px;line-height:1;padding:4px 6px;cursor:pointer}
.hmenu{position:absolute;right:0;top:30px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:6px 10px 10px;background:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.08);border-radius:10px;min-width:110px}
.hmenu[hidden]{display:none}
.ml{border:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:6px 4px;cursor:pointer}
.ml.lg{color:var(--mute);font-size:14px}.ml.lg.on{color:var(--ink);font-weight:800}
.btn.sm{font-size:12px;height:28px;min-width:0;padding:0 11px}
@media(max-width:340px){.qty{flex-wrap:wrap;justify-content:flex-end}.qg{width:auto}.pg{width:auto}}
#vw{flex-wrap:nowrap;gap:clamp(3px,1.2vw,6px)}
#vw .btn{flex:0 1 auto;min-width:0;white-space:nowrap;font-size:clamp(9px,2.9vw,12px);height:clamp(24px,7vw,28px);padding:0 clamp(6px,2.2vw,11px)}
html[lang=en] nav button{font-size:clamp(8px,2.9vw,14px)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;font-weight:700;padding:5px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
#flt{flex-wrap:nowrap;gap:8px}
#csel .dd,#xsel>.dd{border-radius:10px;height:36px;font-size:13px}
#xsel{flex-wrap:nowrap;gap:8px;align-items:center}
.xfmt{position:relative}
.xfmt select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
#cflt,#xflt{display:flex;flex-wrap:wrap;gap:6px}
#cflt .btn,#xflt .btn{flex:1 1 auto;height:clamp(28px,8vw,34px);min-width:0;padding:0 clamp(8px,2.6vw,14px);border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;font-size:clamp(10px,3.1vw,13px)}
#cflt .btn small,#xflt .btn small{font-size:.85em;font-weight:600;opacity:.7}
html[lang=en] #cflt .btn,html[lang=en] #xflt .btn{font-size:clamp(9px,2.7vw,12px);padding:0 clamp(6px,2vw,12px);gap:3px}
</style>
</head>
<body>
<header>
  <h1 id="ttl" style="margin-right:auto"></h1>
  <div class="hm">
    <button class="hb" id="hbtn" aria-label="menu" onclick="toggleMenu(event)">☰</button>
    <div class="hmenu" id="hmenu" hidden>
      <button class="ml" onclick="saveData()" data-i="save"></button>
      <button class="ml" onclick="pickFile()" data-i="load"></button>
      <input type="file" id="ifile" accept="application/json,.json" hidden>
      <button class="ml lg" data-l="ko">한국어</button>
      <button class="ml lg" data-l="zh">繁體中文</button>
      <button class="ml lg" data-l="en">English</button>
    </div>
  </div>
</header>
<nav><button data-t="calc" data-i="tabCalc"></button><button data-t="col" data-i="tabCol"></button><button data-t="ex" data-i="tabEx"></button><button data-t="cal" data-i="tabCal"></button></nav>
<main>
  <section class="tab" id="calc">
    <div class="chips" id="vw"></div>
    <div id="gacc"></div>
    <div id="goods"></div>
    <div id="menu"></div>
    <div id="prio"></div>
  </section>
  <section class="tab" id="col">
    <div class="chips" id="cflt"></div>
    <div class="chips" id="flt" style="justify-content:flex-end;align-items:center"></div>
    <div class="grid" id="cgrid"></div>
  </section>
  <section class="tab" id="cal">
    <div class="chips" id="mhead"></div>
    <div class="cg" id="cg"></div>
    <div id="dayp"></div>
    <div id="myres"></div>
  </section>
  <section class="tab" id="ex">
    <div class="chips" id="xflt"></div>
    <div id="xsel" style="display:flex;justify-content:flex-end;margin-bottom:8px"></div>
    <h2 data-i="give"></h2><div class="grid" id="exg"></div>
    <h2 data-i="want" id="hw"></h2><div class="grid" id="exw"></div>
    <canvas id="cv"></canvas>
    <input type="text" id="hdl" data-p="handle">
    <input type="text" id="note" data-p="note">
    <p><button class="btn pri" onclick="dl()" data-i="download"></button></p>
  </section>
</main>
<footer id="ft"><div data-i="copyR"></div><div><span data-i="contact"></span>: <a href="https://x.com/mc_koma_mc" target="_blank" rel="noopener noreferrer">@mc_koma_mc</a></div></footer>
<div id="sum"><div></div></div>

function fillSet(gap){ // gap 이상을 가장 적게 초과하는 조합 (무한 배낭)
  const ps=CFG.goods.map(g=>g.price),gc=ps.reduce(function f(a,b){return b?f(b,a%b):a}),mx=Math.max(...ps),lim=Math.ceil(gap/gc)+Math.ceil(mx/gc);
  const par=new Array(lim+1).fill(-1);par[0]=-2;
  for(let s=1;s<=lim;s++)for(let i=0;i<ps.length;i++){const p=ps[i]/gc;if(s>=p&&par[s-p]!==-1){par[s]=i;break}}
  for(let s=Math.ceil(gap/gc);s<=lim;s++)if(par[s]!==-1){const c={};let x=s;while(x>0){const i=par[x];c[i]=(c[i]||0)+1;x-=ps[i]/gc}return{sum:s*gc,c}}
  return null;
}

function split(){const U=S.unit||CFG.unit,pool=[];ord().forEach(id=>{const g=CFG.goods.find(x=>x.id===id);for(let i=0;i<(S.qty[id]||0);i++)pool.push(g)});const R=[];let r={items:[],sum:0};pool.forEach(g=>{r.items.push(g);r.sum+=g.price;if(r.sum>=U){R.push(r);r={items:[],sum:0}}});if(r.items.length)R.push(r);return R}

const IM={};let tm;
function img(src){if(!src)return null;let i=IM[src];if(!i){i=IM[src]=new Image();i.crossOrigin='anonymous';i.onload=()=>{clearTimeout(tm);tm=setTimeout(draw,60)};i.src=src}return i.complete&&i.naturalWidth?i:null}
function rr(x,p,y,w,h,r){x.beginPath();x.roundRect?x.roundRect(p,y,w,h,r):x.rect(p,y,w,h)}
function draw(){
  const trade=xm()==='trade',{g,w}=xlists(),G=g.filter(a=>!S.ex[a[0].id]),W=w.filter(a=>!S.ex[a[0].id]);
  const cols=xcols(),cell=Math.round(170-(cols-3)*14),gap=cols>4?10:18,kk=cell/170,pad=50,mid=trade?60:0,half=cols*cell+(cols-1)*gap,CW=pad*2+half*(trade?2:1)+mid;
  const rows=Math.max(1,Math.ceil((trade?Math.max(G.length,W.length):G.length)/cols)),top=160,CH=top+rows*(cell*4/3+46)+50;
  const c=$('cv'),x=c.getContext('2d');c.width=CW;c.height=CH;
  const ink='#1e2340',acc='#e4456e',ok='#2a9d8f';
  x.fillStyle='#eef0f6';x.fillRect(0,0,CW,CH);
  x.fillStyle=ink;x.fillRect(0,0,CW,12);
    x.font='600 26px "Pretendard","Noto Sans KR","Noto Sans TC",sans-serif';x.fillStyle=acc;x.fillText($('hdl').value,pad,70);
  x.fillStyle=ink;x.font='400 22px "Pretendard","Noto Sans KR","Noto Sans TC",sans-serif';x.fillText($('note').value,pad,108);
  const sec=(items,ox,label,col)=>{
    x.fillStyle=col;x.font='800 28px "Pretendard","Noto Sans KR","Noto Sans TC",sans-serif';x.fillText(label,ox,top-12);
    items.forEach(([k,n],i)=>{
      const cx=ox+(i%cols)*(cell+gap),cy=top+Math.floor(i/cols)*(cell*4/3+46),ch=k.sq?cell:cell*4/3;
      x.save();rr(x,cx,cy,cell,ch,10);x.clip();
      x.fillStyle=`hsl(${hue(k.id)} 60% 86%)`;x.fillRect(cx,cy,cell,ch);
      const im=img(k.img);
      if(im){const s=Math.max(cell/im.naturalWidth,ch/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;x.drawImage(im,cx+(cell-dw)/2,cy+(ch-dh)/2,dw,dh)}
      else{x.fillStyle='rgba(30,35,64,.5)';x.font='800 40px sans-serif';x.textAlign='center';x.fillText(nm(k.name).slice(0,3),cx+cell/2,cy+ch/2+14);x.textAlign='left'}
      x.restore();
      if(n>0){x.fillStyle=acc;rr(x,cx+cell-58*kk,cy+8,50*kk,30*kk,15*kk);x.fill();x.fillStyle='#fff';x.font='800 '+Math.round(20*kk)+'px sans-serif';x.textAlign='center';x.fillText('×'+n,cx+cell-33*kk,cy+30*kk);x.textAlign='left'}
      x.fillStyle=ink;x.font='500 '+Math.round(20*kk)+'px "Pretendard","Noto Sans KR","Noto Sans TC",sans-serif';x.textAlign='center';x.fillText(nm(k.name),cx+cell/2,cy+ch+28,cell);x.textAlign='left';
    });
  };
  sec(G,pad,t('give'),ok);
  if(trade){sec(W,pad+half+mid,t('want'),acc);x.fillStyle=ink;x.globalAlpha=.25;x.fillRect(pad+half+mid/2-1,top,2,CH-top-40);x.globalAlpha=1}
}

const SC=CFG.sched,pad2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const pd=x=>{const [y,m,d]=x.split('-').map(Number);return new Date(y,m-1,d)};
const mins=h=>{const [a,b]=h.split(':').map(Number);return a*60+b},hm=m=>pad2(Math.floor(m/60))+':'+pad2(m%60);
const isResOnly=x=>!!SC.resOnly&&x>=SC.resOnly.from&&x<=SC.resOnly.to;
const inRange=x=>x>=SC.start&&x<=SC.end&&!(SC.closed||[]).includes(x);
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isPocha=(x,st)=>SC.pochaDays.includes(pd(x).getDay())&&mins(st)>=mins(SC.pochaFrom);
function slots(x){const dw=pd(x).getDay(),close=mins(SC.close[dw]||SC.close.def),out=[];for(let m=mins(SC.open);m+SC.minutes<=close;m+=SC.step)out.push({n:out.length+1,st:hm(m),en:hm(m+SC.minutes),pocha:isPocha(x,hm(m))});return out}

function memo(x,st,v){S.res[x][st].memo=v;save()}
function renderCal(){
  const tdy=ymd(new Date());if(!S.cd)S.cd=inRange(tdy)?tdy:SC.start;if(!S.cm)S.cm=S.cd.slice(0,7);
  const loc={ko:'ko-KR',zh:'zh-TW',en:'en-US'}[lang],wd=lang==='ko'?['일','월','화','수','목','금','토']:lang==='zh'?['日','一','二','三','四','五','六']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=[];for(let d=pd(SC.start.slice(0,7)+'-01'),e=pd(SC.end.slice(0,7)+'-01');d<=e;d=new Date(d.getFullYear(),d.getMonth()+1,1))months.push(ymd(d).slice(0,7));
  $('mhead').innerHTML=months.map(m=>`<button class="btn ${S.cm===m?'on':''}" onclick="setMonth('${m}')">${pd(m+'-01').toLocaleDateString(loc,{year:'numeric',month:'long'})}</button>`).join('');
  const first=pd(S.cm+'-01'),dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  let g=wd.map(w=>`<div class="wd">${w}</div>`).join('')+'<div></div>'.repeat(first.getDay());
  for(let d=1;d<=dim;d++){const x=S.cm+'-'+pad2(d),ok=inRange(x),n=Object.keys((S.res||{})[x]||{}).length;
    g+=`<button class="day ${ok?'':'off'} ${S.cd===x?'sel':''}" ${ok?`onclick="pick('${x}')"`:'disabled'}><b>${d}</b>${ok&&SC.pochaDays.includes(pd(x).getDay())?'<i class="pc"></i>':''}${n?`<span class="rb">${n}</span>`:''}${ok&&isResOnly(x)?'<i class="ro"></i>':''}</button>`}

  const x=S.cd,r=(S.res||{})[x]||{};
  let p=`<h2>${pd(x).toLocaleDateString(loc,{month:'long',day:'numeric',weekday:'short'})}</h2>`;
  if(inRange(x)&&isResOnly(x))p+=`<p class="rnote">${t('resOnly')}</p>`;
  p+=inRange(x)?slots(x).map(sl=>{const b=r[sl.st];return `<div class="slot ${b?'mine':''}"><div><b>${t('slotN').replace('{n}',sl.n)} ${sl.st}~${sl.en}</b> <span class="tag ${sl.pocha?'pc':''}">${sl.pocha?t('slotPocha'):t('slotCafe')}</span></div><button class="btn ${b?'pri':''}" onclick="book('${x}','${sl.st}')">${b?t('booked'):t('book')}</button>${b?`<input type="text" value="${esc(b.memo)}" placeholder="${t('memoPh')}" oninput="memo('${x}','${sl.st}',this.value)">`:''}</div>`}).join(''):`<p class="tip">${t('closedDay')}</p>`;

  $('myres').innerHTML=`<h2>${t('myRes')}</h2>`+(all.length?all.map(([d,st,b])=>`<div class="rc"><div style="display:flex;justify-content:space-between;gap:8px"><span><b>${pd(d).toLocaleDateString(loc,{month:'short',day:'numeric',weekday:'short'})}</b> ${t('slotN').replace('{n}',(slots(d).find(x=>x.st===st)||{}).n||'')} ${st}~${hm(mins(st)+SC.minutes)} <span class="tag ${isPocha(d,st)?'pc':''}">${isPocha(d,st)?t('slotPocha'):t('slotCafe')}</span></span><span><button class="btn" onclick="pick('${d}')">↗</button> <button class="btn" onclick="book('${d}','${st}')">✕</button></span></div>${b.memo?`<small>${esc(b.memo)}</small>`:''}</div>`).join(''):`<p class="tip">${t('noRes')}</p>`);

$('ifile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.S!=='object'||!d.S||Array.isArray(d.S))throw 0;if(!confirm(t('loadAsk')))return;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,{cat:'all',fq:{},qty:{},have:{},ex:{},perR:false,flt:'all'});Object.keys(d.S).forEach(k=>{if(k!=='__proto__'&&k!=='constructor'&&k!=='prototype')S[k]=d.S[k]});if(['ko','zh','en'].includes(d.lang))lang=d.lang;save();applyLang();$('hmenu').hidden=true}catch(err){alert(t('loadErr'))}};r.readAsText(f)};
document.querySelectorAll('.ml.lg').forEach(b=>b.onclick=()=>{lang=b.dataset.l;save();applyLang()});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
$('hdl').oninput=$('note').oninput=draw;
applyLang();show('calc');
</script>
